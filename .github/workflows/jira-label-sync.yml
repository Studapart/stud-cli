# Sync mapped GitHub PR labels to Jira using .github/scripts/sync-pr-labels.sh.
# Preserves Jira labels that are not values in STUD_JIRA_LABEL_MAP.
#
# Requires: secrets STUD_JIRA_* and repository variable STUD_JIRA_LABEL_MAP (JSON object).
# Soft-skips (exit 0) when Jira secrets are missing or items:show fails for provider=jira.
# See documentation/github-actions.md
#
# Safeguards:
# - Skips fork PRs (secrets are unavailable on pull_request from forks)

name: Jira label sync

on:
  pull_request:
    types: [labeled, unlabeled]

jobs:
  jira-label-sync:
    name: Jira label sync
    if: >-
      ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate on Jira secrets
        id: gate
        shell: bash
        env:
          JIRA_URL: ${{ secrets.STUD_JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.STUD_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.STUD_JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${JIRA_URL}" ] || [ -z "${JIRA_EMAIL}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo 'Soft-skip: STUD_JIRA_URL, STUD_JIRA_EMAIL, and/or STUD_JIRA_API_TOKEN are not set. Soft-skip is not a sync; configure secrets for real Jira label sync.'
            echo "continue=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'Jira secrets present; continuing.'
          echo "continue=true" >> "${GITHUB_OUTPUT}"

      - name: Set up stud and Jira config
        if: steps.gate.outputs.continue == 'true'
        uses: ./.github/actions/stud-cli-setup
        with:
          jira-url: ${{ secrets.STUD_JIRA_URL }}
          jira-email: ${{ secrets.STUD_JIRA_EMAIL }}
          jira-api-token: ${{ secrets.STUD_JIRA_API_TOKEN }}
          # SHA selects setup-stud.sh text from this ref; non-semver refs still install latest release PHAR.
          stud-install-ref: ${{ github.event.pull_request.head.sha }}
          validate-skip-git: true

      - name: Merge mapped PR labels into Jira
        if: steps.gate.outputs.continue == 'true'
        shell: bash
        env:
          PROVIDER: jira
          MAP_VAR_NAME: STUD_JIRA_LABEL_MAP
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          HEAD_REF: ${{ github.head_ref }}
          LABEL_MAP_JSON: ${{ vars.STUD_JIRA_LABEL_MAP }}
        run: bash .github/scripts/sync-pr-labels.sh
