# Sync mapped GitHub PR labels to Linear using .github/scripts/sync-pr-labels.sh.
# Preserves Linear labels that are not values in STUD_LINEAR_LABEL_MAP.
#
# Requires: secret STUD_LINEAR_API_KEY and repository variable STUD_LINEAR_LABEL_MAP (JSON object).
# Soft-skips (exit 0) when Linear secret is missing or items:show fails for provider=linear.
# Soft-skip is not a sync — configure STUD_LINEAR_API_KEY + STUD_LINEAR_LABEL_MAP for real sync.
# See documentation/github-actions.md
#
# Safeguards:
# - Skips fork PRs (secrets are unavailable on pull_request from forks)

name: Linear label sync

on:
  pull_request:
    types: [labeled, unlabeled]

jobs:
  linear-label-sync:
    name: Linear label sync
    if: >-
      ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gate on Linear secret
        id: gate
        shell: bash
        env:
          LINEAR_API_KEY: ${{ secrets.STUD_LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY}" ]; then
            echo 'Soft-skip: STUD_LINEAR_API_KEY is not set. Soft-skip is not a sync; set STUD_LINEAR_API_KEY and STUD_LINEAR_LABEL_MAP for real Linear label sync.'
            echo "continue=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'Linear secret present; continuing.'
          echo "continue=true" >> "${GITHUB_OUTPUT}"

      - name: Set up stud and Linear config
        if: steps.gate.outputs.continue == 'true'
        uses: ./.github/actions/stud-cli-setup
        with:
          linear-api-key: ${{ secrets.STUD_LINEAR_API_KEY }}
          # SHA selects setup-stud.sh text from this ref; non-semver refs still install latest release PHAR.
          stud-install-ref: ${{ github.event.pull_request.head.sha }}
          validate-skip-git: true

      - name: Merge mapped PR labels into Linear
        if: steps.gate.outputs.continue == 'true'
        shell: bash
        env:
          PROVIDER: linear
          MAP_VAR_NAME: STUD_LINEAR_LABEL_MAP
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          HEAD_REF: ${{ github.head_ref }}
          LABEL_MAP_JSON: ${{ vars.STUD_LINEAR_LABEL_MAP }}
        run: bash .github/scripts/sync-pr-labels.sh
