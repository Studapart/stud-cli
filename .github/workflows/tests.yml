name: PHPUnit Tests and Coverage

on:
  pull_request:
    branches:
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    # Dependabot (and fork) PRs default GITHUB_TOKEN to read-only; without this,
    # github-script cannot post the coverage comment (403 Resource not accessible by integration).
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          update: true
        with:
          php-version: '8.5'
          extensions: pcov, xml
          coverage: pcov

      - name: Require the patched PHP line
        run: php scripts/check-php-floor.php

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run PHPMD
        run: vendor/bin/phpmd analyze --no-progress src castor.php

      - name: Run tests, coverage, and the CRAP gate
        id: coverage
        run: |
          set -o pipefail
          mkdir -p .cursor/tmp
          php -dpcov.enabled=1 -dpcov.directory=. -dpcov.exclude="~vendor~" -dzend.assertions=1 ./vendor/bin/phpunit --colors=never --coverage-text --coverage-clover .cursor/tmp/phpunit-clover.xml | tee /tmp/coverage.txt
          php scripts/check-crap.php .cursor/tmp/phpunit-clover.xml crap.baseline.txt
          COVERAGE=$(awk '/^[[:space:]]*Summary:/,/^[[:space:]]*Lines:/' /tmp/coverage.txt)
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$COVERAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const output = `${{ steps.coverage.outputs.summary }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Code Coverage Summary\n\n\`\`\`\n${output}\n\`\`\``
            });
