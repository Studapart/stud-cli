name: stud-cli-setup
description: >-
  Install stud-cli (PHP 8.2+, pinned setup-stud.sh), write ~/.config/stud/config.yml and optionally
  .git/stud.config from workflow inputs/secrets, then run stud config:validate --agent.
author: Studapart

branding:
  icon: terminal
  color: purple

inputs:
  jira-url:
    description: >-
      Jira Cloud base URL without trailing slash (e.g. https://your-domain.atlassian.net).
      Required for Jira-only or dual-provider jobs; omit for Linear-only CI.
    required: false
    default: ''
  jira-email:
    description: Atlassian account email for the Jira REST API. Required when Jira credentials are used.
    required: false
    default: ''
  jira-api-token:
    description: Jira API token. Pass from a GitHub secret; do not echo or print.
    required: false
    default: ''
  linear-api-key:
    description: Linear API key written to LINEAR_API_KEY in global config when non-empty.
    required: false
    default: ''
  work-item-providers:
    description: >-
      Optional explicit issue-tracker providers for validate and ISSUE_TRACKER_PROVIDERS:
      jira, linear, or both. When empty, derived from non-empty Jira / Linear secret inputs.
    required: false
    default: ''
  language:
    description: stud global LANGUAGE value (e.g. en).
    required: false
    default: en
  github-token:
    description: Optional GITHUB_TOKEN for stud GitHub operations.
    required: false
    default: ''
  gitlab-token:
    description: Optional GitLab personal access token.
    required: false
    default: ''
  gitlab-instance-url:
    description: Optional GitLab instance URL when using GitLab.
    required: false
    default: ''
  jira-transition-enabled:
    description: 'If true, sets JIRA_TRANSITION_ENABLED: true in global config.'
    required: false
    default: 'false'
  stud-install-ref:
    description: >-
      Git ref on Studapart/stud-cli for setup-stud.sh (branch, tag, or SHA). Pin to a tag or SHA
      for supply-chain consistency; must include --skip-init support when using the default install args.
      When this is a semver tag (for example v3.18.2), the installer uses that release without
      calling the GitHub releases/latest API.
    required: false
    default: develop
  stud-setup-script-ref:
    description: >-
      Optional Git ref for setup-stud.sh itself. Defaults to stud-install-ref. Use a commit or
      branch that contains installer fixes while stud-install-ref stays pinned to a release tag.
    required: false
    default: ''
  run-config-validate:
    description: Run stud config:validate --agent after writing configuration.
    required: false
    default: 'true'
  validate-skip-git:
    description: When true, pass skipGit true to config:validate (typical for issue-tracker-only CI jobs).
    required: false
    default: 'true'
  project-stud-config:
    description: >-
      Optional multiline content written to .git/stud.config. Requires actions/checkout (or equivalent)
      before this action so the repository .git directory exists.
    required: false
    default: ''
  php-version:
    description: PHP version passed to shivammathur/setup-php.
    required: false
    default: '8.2'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: xml, curl, mbstring

    - name: Install stud-cli
      shell: bash
      env:
        STUD_INSTALL_REF: ${{ inputs.stud-install-ref }}
        STUD_SETUP_SCRIPT_REF: ${{ inputs.stud-setup-script-ref }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        script_ref="${STUD_SETUP_SCRIPT_REF:-$STUD_INSTALL_REF}"
        url="https://raw.githubusercontent.com/Studapart/stud-cli/${script_ref}/setup-stud.sh"
        attempts="${STUD_INSTALL_SCRIPT_ATTEMPTS:-5}"
        for attempt in $(seq 1 "$attempts"); do
          if curl -fsSL "$url" | bash -s -- --force --skip-init; then
            exit 0
          fi
          if [ "$attempt" -eq "$attempts" ]; then
            echo "Failed to install stud-cli from ${url} after ${attempts} attempt(s)." >&2
            exit 1
          fi
          sleep $((attempt * 3))
        done

    - name: Add stud to PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Write global stud config
      shell: bash
      env:
        JIRA_URL: ${{ inputs.jira-url }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        WORK_ITEM_PROVIDERS: ${{ inputs.work-item-providers }}
        LANGUAGE: ${{ inputs.language }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITLAB_TOKEN: ${{ inputs.gitlab-token }}
        GITLAB_INSTANCE_URL: ${{ inputs.gitlab-instance-url }}
        JIRA_TRANSITION_ENABLED: ${{ inputs.jira-transition-enabled }}
      run: |
        set -euo pipefail
        cfg="${HOME}/.config/stud/config.yml"
        mkdir -p "${HOME}/.config/stud"
        umask 077

        has_jira=false
        if [ -n "${JIRA_URL}" ] && [ -n "${JIRA_EMAIL}" ] && [ -n "${JIRA_API_TOKEN}" ]; then
          has_jira=true
        fi
        has_linear=false
        if [ -n "${LINEAR_API_KEY}" ]; then
          has_linear=true
        fi

        use_jira=false
        use_linear=false
        case "${WORK_ITEM_PROVIDERS}" in
          jira)
            use_jira=true
            ;;
          linear)
            use_linear=true
            ;;
          both)
            use_jira=true
            use_linear=true
            ;;
          '')
            use_jira=$has_jira
            use_linear=$has_linear
            ;;
          *)
            echo "Invalid work-item-providers: ${WORK_ITEM_PROVIDERS}. Use jira, linear, or both." >&2
            exit 1
            ;;
        esac

        {
          echo "LANGUAGE: ${LANGUAGE}"
          if [ "$use_jira" = true ]; then
            if [ "$has_jira" = false ]; then
              echo "work-item-providers includes jira but Jira URL, email, and API token are required." >&2
              exit 1
            fi
            jira_url="${JIRA_URL%/}"
            echo "JIRA_URL: ${jira_url}"
            echo "JIRA_EMAIL: ${JIRA_EMAIL}"
            echo "JIRA_API_TOKEN: ${JIRA_API_TOKEN}"
            if [ "${JIRA_TRANSITION_ENABLED}" = "true" ]; then
              echo "JIRA_TRANSITION_ENABLED: true"
            else
              echo "JIRA_TRANSITION_ENABLED: false"
            fi
          fi
          if [ "$use_linear" = true ]; then
            if [ "$has_linear" = false ]; then
              echo "work-item-providers includes linear but linear-api-key is required." >&2
              exit 1
            fi
            echo "LINEAR_API_KEY: ${LINEAR_API_KEY}"
          fi
          if [ "$use_jira" = true ] || [ "$use_linear" = true ]; then
            echo "ISSUE_TRACKER_PROVIDERS:"
            if [ "$use_jira" = true ]; then
              echo "  - jira"
            fi
            if [ "$use_linear" = true ]; then
              echo "  - linear"
            fi
          fi
          if [ -n "${GITHUB_TOKEN}" ]; then
            echo "GITHUB_TOKEN: ${GITHUB_TOKEN}"
          fi
          if [ -n "${GITLAB_TOKEN}" ]; then
            echo "GITLAB_TOKEN: ${GITLAB_TOKEN}"
          fi
          if [ -n "${GITLAB_INSTANCE_URL}" ]; then
            echo "GITLAB_INSTANCE_URL: ${GITLAB_INSTANCE_URL}"
          fi
        } > "$cfg"
        chmod 600 "$cfg"

    - name: Write project stud config
      if: ${{ inputs.project-stud-config != '' }}
      shell: bash
      env:
        PROJECT_STUD_CONFIG: ${{ inputs.project-stud-config }}
      run: |
        set -euo pipefail
        mkdir -p .git
        printf '%s\n' "${PROJECT_STUD_CONFIG}" > .git/stud.config
        chmod 600 .git/stud.config

    - name: Validate stud configuration
      if: ${{ inputs.run-config-validate == 'true' }}
      shell: bash
      env:
        JIRA_URL: ${{ inputs.jira-url }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        WORK_ITEM_PROVIDERS: ${{ inputs.work-item-providers }}
      run: |
        set -euo pipefail

        has_jira=false
        if [ -n "${JIRA_URL}" ] && [ -n "${JIRA_EMAIL}" ] && [ -n "${JIRA_API_TOKEN}" ]; then
          has_jira=true
        fi
        has_linear=false
        if [ -n "${LINEAR_API_KEY}" ]; then
          has_linear=true
        fi

        validate_jira=false
        validate_linear=false
        case "${WORK_ITEM_PROVIDERS}" in
          jira)
            validate_jira=true
            ;;
          linear)
            validate_linear=true
            ;;
          both)
            validate_jira=true
            validate_linear=true
            ;;
          '')
            validate_jira=$has_jira
            validate_linear=$has_linear
            ;;
          *)
            echo "Invalid work-item-providers: ${WORK_ITEM_PROVIDERS}. Use jira, linear, or both." >&2
            exit 1
            ;;
        esac

        if [ "$validate_jira" = false ] && [ "$validate_linear" = false ]; then
          echo "At least one of Jira credentials or linear-api-key must be provided for config:validate." >&2
          exit 1
        fi

        skip_jira=true
        skip_linear=true
        skip_git=true
        if [ "$validate_jira" = true ]; then
          skip_jira=false
        fi
        if [ "$validate_linear" = true ]; then
          skip_linear=false
        fi
        if [ "${{ inputs.validate-skip-git }}" != 'true' ]; then
          skip_git=false
        fi

        echo "{\"skipJira\":${skip_jira},\"skipGit\":${skip_git},\"skipLinear\":${skip_linear}}" | stud config:validate --agent
